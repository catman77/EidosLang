name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # compileSdk is 37 and the build-tools are pinned with it. Installed explicitly rather than
      # left to AGP, so a missing package fails here with a clear message instead of halfway
      # through a Gradle configuration phase.
      - name: Android SDK packages
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" || \
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      # There is no Gradle wrapper in this repository, on purpose: AGP 9.3.0 requires Gradle 9.5.0
      # and bootstrapping a wrapper under an older Gradle fails before it can evaluate the build.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        working-directory: android
        run: gradle :core-model:testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Name the artefact after the commit
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          OUT="eidolang-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$OUT" | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: eidolang-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # A rolling "latest" release, so there is always one stable URL to send somebody who just
      # wants to install the thing — build artefacts expire and require a GitHub login to fetch.
      - name: Publish to the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${{ steps.apk.outputs.path }}" \
            --title "Последняя сборка" \
            --notes "Отладочная сборка из \`${GITHUB_SHA::7}\`, ${{ steps.apk.outputs.size }}.
          Скачайте APK ниже и установите на Android 8.0 или новее.
          Это отладочная подпись: при первой установке Android предупредит о неизвестном источнике." \
            --prerelease

      - name: Publish a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}" --generate-notes
