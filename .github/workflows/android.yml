name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # compileSdk is 37 and the build-tools are pinned with it. Installed explicitly rather than
      # left to AGP, so a missing package fails here with a clear message instead of halfway
      # through a Gradle configuration phase.
      - name: Android SDK packages
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" || \
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      # There is no Gradle wrapper in this repository, on purpose: AGP 9.3.0 requires Gradle 9.5.0
      # and bootstrapping a wrapper under an older Gradle fails before it can evaluate the build.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        working-directory: android
        run: gradle :core-model:testDebugUnitTest :core-canonical:testDebugUnitTest --no-daemon

      - name: Build debug APK
        if: github.event_name == 'pull_request'
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Restore distribution signing key
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/android-signing
        with:
          keystore-base64: ${{ secrets.EIDOLANG_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          EIDOLANG_STORE_PASSWORD: ${{ secrets.EIDOLANG_STORE_PASSWORD }}
          EIDOLANG_KEY_ALIAS: ${{ secrets.EIDOLANG_KEY_ALIAS }}
          EIDOLANG_KEY_PASSWORD: ${{ secrets.EIDOLANG_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:assembleMigration --no-daemon

      - name: Verify distribution signing certificate
        if: github.event_name != 'pull_request'
        run: |
          bash android/tools/verify-apk-signature.sh android/app/build/outputs/apk/release/app-release.apk
          bash android/tools/verify-apk-signature.sh android/app/build/outputs/apk/migration/app-migration.apk

      - name: Remove signing key from runner
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/eidolang-signing.keystore"

      - name: Name the artefact after the commit
        id: apk
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ "$IS_PULL_REQUEST" == 'true' ]]; then
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
          else
            SRC=android/app/build/outputs/apk/release/app-release.apk
          fi
          OUT="eidolang-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$OUT" | cut -f1)" >> "$GITHUB_OUTPUT"
          if [[ "$IS_PULL_REQUEST" != 'true' ]]; then
            MIGRATION_OUT="eidolang-${GITHUB_SHA::7}-migration.apk"
            cp android/app/build/outputs/apk/migration/app-migration.apk "$MIGRATION_OUT"
            echo "migration_path=$MIGRATION_OUT" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'eidolang-debug-apk' || 'eidolang-release-apk' }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.migration_path }}
          retention-days: 30

      # A rolling "latest" release, so there is always one stable URL to send somebody who just
      # wants to install the thing — build artefacts expire and require a GitHub login to fetch.
      - name: Publish to the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.migration_path }}" \
            --title "Последняя сборка" \
            --notes "Сборка из \`${GITHUB_SHA::7}\`, ${{ steps.apk.outputs.size }}.
          Скачайте APK ниже и установите на Android 8.0 или новее.
          Обычный APK обновляет версии с постоянной подписью.
          Для первой публичной версии с другой подписью используйте APK с суффиксом -migration: он устанавливается рядом и подключается как дополнительное устройство. Старое приложение хранит основной ключ и полную переписку; его нужно сохранить. Порядок подключения описан в README." \
            --prerelease

      - name: Publish a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.migration_path }}" --generate-notes
