name: Android release on self-hosted runner

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string
      runner_label:
        description: Label of the prepared ephemeral runner
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    # Manual runs only: pull requests never dispatch work to a developer's machine.
    runs-on: [self-hosted, Linux, X64, '${{ inputs.runner_label }}']
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Restore distribution signing key
        uses: ./.github/actions/android-signing
        with:
          keystore-base64: ${{ secrets.EIDOLANG_KEYSTORE_BASE64 }}

      # The runner provides JDK 21, Android SDK 37 and Gradle 9.5.0.
      - name: Unit tests and APK build
        working-directory: android
        env:
          TMPDIR: ${{ runner.temp }}
          EIDOLANG_STORE_PASSWORD: ${{ secrets.EIDOLANG_STORE_PASSWORD }}
          EIDOLANG_KEY_ALIAS: ${{ secrets.EIDOLANG_KEY_ALIAS }}
          EIDOLANG_KEY_PASSWORD: ${{ secrets.EIDOLANG_KEY_PASSWORD }}
        run: gradle :core-model:testDebugUnitTest :core-canonical:testDebugUnitTest :app:assembleRelease :app:assembleMigration --no-daemon -Djava.io.tmpdir="$TMPDIR"

      - name: Verify distribution signing certificate
        run: |
          bash android/tools/verify-apk-signature.sh android/app/build/outputs/apk/release/app-release.apk
          bash android/tools/verify-apk-signature.sh android/app/build/outputs/apk/migration/app-migration.apk

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/eidolang-signing.keystore"

      - name: Publish versioned APK
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const tag = process.env.RELEASE_TAG;
            const metadata = JSON.parse(fs.readFileSync('android/app/build/outputs/apk/release/output-metadata.json'));
            const version = metadata.elements[0].versionName;
            if (tag !== `v${version}`) throw new Error('Tag and APK version differ');
            const sha = cp.execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
            const outputs = [
              [`eidolang-${version}-${sha.slice(0, 7)}.apk`, 'android/app/build/outputs/apk/release/app-release.apk'],
              [`eidolang-${version}-${sha.slice(0, 7)}-migration.apk`, 'android/app/build/outputs/apk/migration/app-migration.apk']
            ];
            const {owner, repo} = context.repo;
            const generated = (await github.rest.repos.generateReleaseNotes({owner, repo, tag_name: tag})).data;
            const body = `${generated.body}\n\n` +
              `Собрано из ${sha} через GitHub Actions на собственном runner. JVM-тесты прошли.\n\n` +
              'APK подписаны постоянным ключом EidoLang. Нужен Android 8.0 или новее.\n\n' +
              'Обычный APK без суффикса -migration обновляет опубликованный R22.1 с сохранением профиля и переписки. ' +
              'Суффикс -migration обозначает отдельное дополнительное устройство; для обычного обновления эта сборка не нужна. Порядок подключения и ограничения архива — в README.';
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `EidoLang ${version}`, body,
                draft: false, prerelease: false
              })).data;
            }
            for (const [name, path] of outputs) {
              const data = fs.readFileSync(path);
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: existing.id});
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: {'content-type': 'application/vnd.android.package-archive', 'content-length': data.length}
              });
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id, body});
            core.notice(`Published ${release.html_url}`);
