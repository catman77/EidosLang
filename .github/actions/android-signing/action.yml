name: Restore Android distribution key
description: Restore the persistent signing key without using a runner's generated debug key
inputs:
  keystore-base64:
    description: Base64-encoded keystore from a repository secret
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
      run: |
        set -euo pipefail
        if [[ -z "$KEYSTORE_BASE64" ]]; then
          echo "::error::EIDOLANG_KEYSTORE_BASE64 is missing; refusing to publish with a generated key."
          exit 1
        fi
        umask 077
        KEYSTORE_FILE="$RUNNER_TEMP/eidolang-signing.keystore"
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
        echo "EIDOLANG_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
